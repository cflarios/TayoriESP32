name=TayoriESP32
version=0.1.0
author=@cflarios
maintainer=Chris <cristianferlariosm@gmail.com>
sentence=Recibe en un ESP32 las respuestas que Tayori publica por MQTT.
paragraph=Cliente MQTT de alto nivel para ESP32. Se suscribe a los temas de Tayori (<base> y <base>/text), entrega el texto de la respuesta y extrae la opción (A/B/C/D) de un cuestionario para, por ejemplo, encender un LED. Replica el contrato del broker de Tayori: QoS 1, sólo respuestas terminadas. Depende de PubSubClient.
category=Communication
url=https://github.com/cflarios/TayoriESP32
architectures=esp32
depends=PubSubClient
