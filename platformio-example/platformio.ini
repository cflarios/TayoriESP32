; Proyecto PlatformIO de ejemplo para TayoriESP32.
;
; Cópialo tal cual como punto de partida. Compila sin cablear nada: main.cpp es
; el ejemplo RawText, que vuelca al monitor serie cada respuesta que llega — la
; forma de confirmar que el broker y el tema coinciden con los de Tayori.
;
; Ajusta `board` a tu placa (esp32dev, esp32-s3-devkitc-1, lolin32, …).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    ; La librería, fijada al tag para builds reproducibles. Quita el #v0.1.0
    ; para seguir la rama main (a cambio de que un cambio pueda romper el build).
    https://github.com/cflarios/TayoriESP32.git#v0.1.0
    ; PubSubClient lo arrastra library.json, pero declararlo aquí no molesta y
    ; deja claro de qué depende.
    knolleary/PubSubClient@^2.8

    ; Descomenta según el ejemplo que copies en src/main.cpp:
    ; bblanchon/ArduinoJson@^7          ; FullAnswerJson
    ; adafruit/Adafruit SSD1306         ; OledDisplay
    ; adafruit/Adafruit GFX Library     ; OledDisplay
